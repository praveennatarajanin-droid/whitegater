version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whitegator_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whitegator_prod}
      POSTGRES_USER: ${POSTGRES_USER:-whitegator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSuperSecretPassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whitegator_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisSuperSecret2026!} --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSuperSecret2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: whitegator_api_prod
    restart: always
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-whitegator}:${POSTGRES_PASSWORD:-ChangeThisSuperSecretPassword2026!}@postgres:5432/${POSTGRES_DB:-whitegator_prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSuperSecret2026!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: whitegator_web_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
